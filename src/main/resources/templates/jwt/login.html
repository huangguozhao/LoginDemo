<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT登录 - 登录认证方案演示</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #4a5568;
            margin-bottom: 10px;
            font-size: 1.8em;
        }
        .login-header p {
            color: #718096;
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #4a5568;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .login-btn:hover {
            transform: translateY(-2px);
        }
        .login-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #feb2b2;
        }
        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #9ae6b4;
        }
        .demo-info {
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bee3f8;
        }
        .demo-info h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        .demo-info p {
            margin: 5px 0;
            font-size: 13px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .token-display {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            display: none;
        }
        .token-display h4 {
            margin: 0 0 10px 0;
            color: #4a5568;
        }
        .token-text {
            background: #edf2f7;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            word-break: break-all;
            border: 1px solid #e2e8f0;
        }
        .copy-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .copy-btn:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>🔑 JWT Token登录</h2>
            <p>无状态Token认证</p>
        </div>

        <div class="demo-info">
            <h4>演示账号：</h4>
            <p>管理员：admin / admin123</p>
            <p>普通用户：user / user123</p>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>
        <div id="successMessage" class="success-message" style="display: none;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required placeholder="输入用户名">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="输入密码">
            </div>

            <button type="submit" class="login-btn" id="loginBtn">登录获取Token</button>
        </form>

        <div id="tokenDisplay" class="token-display">
            <h4>JWT Token</h4>
            <div id="tokenText" class="token-text"></div>
            <button class="copy-btn" onclick="copyToken()">复制Token</button>
            <br><br>
            <a href="#" onclick="testToken()" style="color: #667eea; text-decoration: none;">🧪 测试API访问</a> |
            <a href="#" onclick="goToDashboard()" style="color: #667eea; text-decoration: none;">📊 进入控制台</a>
        </div>

        <div class="back-link">
            <a href="/">← 返回首页</a>
        </div>
    </div>

    <script>
        let jwtToken = null;

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const loginBtn = document.getElementById('loginBtn');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            hideMessages();

            try {
                const response = await fetch('/jwt/authenticate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    jwtToken = data.token;
                    showSuccess('登录成功！JWT Token已生成');
                    showToken(data.token, data.username, data.role);
                } else {
                    showError(data.error || '登录失败');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录获取Token';
            }
        });

        function showToken(token, username, role) {
            document.getElementById('tokenText').textContent = token;
            document.getElementById('tokenDisplay').style.display = 'block';
        }

        function copyToken() {
            const tokenText = document.getElementById('tokenText').textContent;
            navigator.clipboard.writeText(tokenText).then(function() {
                alert('Token已复制到剪贴板！');
            });
        }

        function testToken() {
            if (!jwtToken) {
                alert('请先登录获取Token');
                return;
            }

            fetch('/jwt/api/test', {
                headers: {
                    'Authorization': 'Bearer ' + jwtToken
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('API测试失败: ' + data.error);
                } else {
                    alert('API测试成功！\\n用户名: ' + data.username + '\\n消息: ' + data.message);
                }
            })
            .catch(error => {
                alert('API测试失败: ' + error.message);
            });
        }

        function goToDashboard() {
            if (!jwtToken) {
                alert('请先登录获取Token');
                return;
            }

            // 跳转到dashboard页面，Token通过URL参数传递（实际应用中应该存储在localStorage中）
            window.location.href = '/jwt/dashboard?token=' + encodeURIComponent(jwtToken);
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSuccess(message) {
            document.getElementById('successMessage').textContent = message;
            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }
    </script>
</body>
</html>
