<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth2登录 - 登录认证方案演示</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #4a5568;
            margin-bottom: 10px;
            font-size: 1.8em;
        }
        .login-header p {
            color: #718096;
            margin: 0;
        }
        .oauth-providers {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            color: #4a5568;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .oauth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #4a5568;
        }
        .oauth-btn.github {
            border-color: #24292e;
            color: #24292e;
        }
        .oauth-btn.github:hover {
            background: #f6f8fa;
            border-color: #24292e;
        }
        .oauth-btn.google {
            border-color: #4285f4;
            color: #4285f4;
        }
        .oauth-btn.google:hover {
            background: #f8f9fa;
            border-color: #4285f4;
        }
        .oauth-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
        }
        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #feb2b2;
        }
        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #9ae6b4;
        }
        .demo-info {
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bee3f8;
        }
        .demo-info h4 {
            margin: 0 0 15px 0;
            font-size: 16px;
        }
        .demo-info p {
            margin: 8px 0;
            font-size: 14px;
        }
        .demo-info .note {
            font-style: italic;
            color: #4a5568;
            font-size: 13px;
        }
        .back-link {
            text-align: center;
            margin-top: 30px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>🔗 OAuth2 / OIDC 登录</h2>
            <p>第三方开放认证协议</p>
        </div>

        <div class="demo-info">
            <h4>🔧 配置说明</h4>
            <p>要使用真实的OAuth2登录，需要：</p>
            <p>1. 在相应平台注册应用获取Client ID和Client Secret</p>
            <p>2. 配置环境变量：GITHUB_CLIENT_ID、GITHUB_CLIENT_SECRET</p>
            <p>3. 或配置Google：GOOGLE_CLIENT_ID、GOOGLE_CLIENT_SECRET</p>
            <p class="note">当前使用演示配置，仅用于展示界面和流程</p>
        </div>

        <div th:if="${error}" class="error-message">
            <strong>登录失败</strong><br>
            请检查OAuth2提供商配置或重试登录
        </div>

        <div th:if="${message}" class="success-message">
            <span th:text="${message}"></span>
        </div>

        <div class="oauth-providers">
            <a href="/oauth2/oauth2/authorization/github" class="oauth-btn github">
                <svg class="oauth-icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                使用 GitHub 登录
            </a>

            <a href="/oauth2/oauth2/authorization/google" class="oauth-btn google">
                <svg class="oauth-icon" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                使用 Google 登录
            </a>
        </div>

        <div class="back-link">
            <a href="/">← 返回首页</a>
        </div>
    </div>
</body>
</html>
